---
# required vars: docker_dir; docker_group; docker_network

# all
singbox_dir: "{{ docker_dir }}/sing-box"

# install
singbox_image: "{{ singbox_dir }}/Dockerfile"
singbox_data: "{{ singbox_dir }}/data"
singbox_compose: "{{ singbox_dir }}/compose.yml"

# deploy_config | deploy_config_mixed
singbox_template_config: "mixed.json.j2"

# deploy_config
singbox_config: "{{ singbox_dir }}/config.json"

# mixed
singbox_listen_port: 1080
