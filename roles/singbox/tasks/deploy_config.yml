---
- name: Deploy sing-box config (normal)
  ansible.builtin.template:
    src: "{{ singbox_template_config }}"
    dest: "{{ singbox_config }}"
    owner: "1000"
    group: "1000"
    mode: "0644"
  when: not singbox_openwrt

- name: Deploy sing-box config (OpenWrt)
  ansible.builtin.include_tasks: deploy_config_openwrt.yml
  when: singbox_openwrt
