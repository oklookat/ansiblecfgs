---
- name: Create sing-box directory
  ansible.builtin.file:
    path: "{{ singbox_dir }}"
    state: directory
    group: "{{ docker_group }}"
    mode: "0755"

- name: Create sing-box data directory
  ansible.builtin.file:
    path: "{{ singbox_data }}"
    state: directory
    mode: "0755"

- include_tasks: update.yml

- name: Render reload script
  ansible.builtin.template:
    src: reload.sh.j2
    dest: "{{ singbox_reload_script }}"
    mode: "0755"
