---
- name: Create sing-box directory
  ansible.builtin.file:
    path: "{{ singbox_dir }}"
    state: directory
    group: "{{ docker_group }}"
    mode: "0755"

- name: Create sing-box data directory
  ansible.builtin.file:
    path: "{{ singbox_data }}"
    state: directory
    mode: "0755"

- name: Copy sing-box Dockerfile
  ansible.builtin.copy:
    src: sing-box.Dockerfile
    dest: "{{ singbox_image }}"
    mode: "0644"
  notify: Rebuild sing-box

- name: Render Compose file
  ansible.builtin.template:
    src: "{{ singbox_template_compose }}"
    dest: "{{ singbox_compose }}"
    mode: "0644"
  notify: Recreate sing-box

- name: Render reload script
  ansible.builtin.template:
    src: reload.sh.j2
    dest: "{{ singbox_reload_script }}"
    mode: "0755"

- include_tasks: deploy_config.yml

- include_tasks: restart.yml
