---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download SagerNet GPG key
  ansible.builtin.get_url:
    url: "{{ singbox_apt_gpg_url }}"
    dest: "{{ singbox_apt_gpg_path }}"
    mode: "0644"

- name: Add SagerNet APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/sagernet.sources
    content: |
      Types: deb
      URIs: {{ singbox_apt_repo }}
      Suites: *
      Components: *
      Enabled: yes
      Signed-By: {{ singbox_apt_gpg_path }}
    mode: "0644"

- name: Install sing-box
  ansible.builtin.apt:
    name: "sing-box"
    state: present
    update_cache: yes
