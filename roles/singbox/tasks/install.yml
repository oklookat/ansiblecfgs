---
- name: Ensure singbox network exists
  community.docker.docker_network:
    name: "{{ singbox_network }}"
    driver: bridge
    enable_ipv6: true
    state: present

- name: Create sing-box directory
  ansible.builtin.file:
    path: "{{ singbox_dir }}"
    state: directory
    group: "{{ docker_group }}"
    mode: "0755"

- name: Create sing-box data directory
  ansible.builtin.file:
    path: "{{ singbox_data }}"
    state: directory
    mode: "0755"

- name: Copy sing-box Dockerfile
  ansible.builtin.copy:
    src: sing-box.Dockerfile
    dest: "{{ singbox_image }}"
    mode: "0644"

- name: Render Compose file
  ansible.builtin.template:
    src: "{{ singbox_template_compose }}"
    dest: "{{ singbox_compose }}"
    mode: "0644"

- name: Render reload script
  ansible.builtin.template:
    src: reload.sh.j2
    dest: "{{ singbox_reload_script }}"
    mode: "0755"
