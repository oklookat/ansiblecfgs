---
# - name: Reload Caddy
#   community.docker.docker_container_exec:
#     container: caddy
#     command: caddy reload --config /etc/caddy/Caddyfile

- name: Reload Caddy
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f {{ caddy_compose }}
      up -d
      --build
    chdir: "{{ caddy_dir }}"

- name: Start Docker Compose
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f {{ caddy_compose }}
      up -d
      --build
    chdir: "{{ caddy_dir }}"
