---
# https://caddyserver.com/docs/install
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
    state: present
    update_cache: true

- name: Download Caddy GPG key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    mode: "0644"
    force: true

- name: Add Caddy APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg]
      https://dl.cloudsmith.io/public/caddy/stable/deb/debian any main
    filename: caddy-stable
    state: present
    mode: "0644"

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
