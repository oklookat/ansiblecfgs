---
caddy_user: "caddy"

# confd | reality_sfy | xhttp_sfy | naive
caddy_domain: ""

# xhttp_sfy (not required if caddy_fullchain and private_key paths present) | naive
caddy_acme_email: ""

# confd
# caddy_sites:
#   - domain: example.com
#     src: templates/example.com.Caddyfile.j2
#   - domain: test.com
#     src: templates/test.com.Caddyfile.j2
#   - domain: blog.example.com
#     src: "" # empty src: will be deleted in remote

# reality_sfy | xhttp_sfy
caddy_port: 443
# reality_sfy | xhttp_sfy | naive
caddy_webroot_path: "/var/www/{{ caddy_domain }}"

# reality_sfy (required) | xhttp_sfy (not required if caddy_acme_email present)
caddy_fullchain_path: ""
caddy_private_key_path: ""

# xhttp_sfy
caddy_location: "/test-is-test"
caddy_grpc_pass: "grpc://unix:/dev/shm/uds2023.sock"

# naive
caddy_pass: "h2c://127.0.0.1:1080"
caddy_proxy_authorization: "" # base64 from "username:password" of naive client "username, password".
