---
# confd | https_check | install_naive | reality_sfy | xhttp_sfy
caddy_system_user: caddy
caddy_system_group: "{{ caddy_system_user }}"

# base | confd | install_naive
caddy_config_dir: /etc/caddy

# reality_sfy | confd | install_naive
caddy_configs_dir: "{{ caddy_config_dir }}/conf.d"

# install_naive
caddy_bin_path: /usr/local/bin/caddy
caddy_data_dir: /var/lib/caddy
caddy_build_dir: /opt/caddy-build

# confd | reality_sfy | xhttp_sfy | install_naive
caddy_domain: ""

# xhttp_sfy (not required if caddy_fullchain and private_key paths present) | install_naive
caddy_acme_email: ""

# confd
# caddy_sites:
#   - domain: example.com
#     src: templates/example.com.Caddyfile.j2
#   - domain: test.com
#     src: templates/test.com.Caddyfile.j2
#   - domain: blog.example.com
#     src: "" # empty src: will be deleted in remote

# reality_sfy | xhttp_sfy
caddy_port: 443

# reality_sfy | xhttp_sfy | install_naive
caddy_webroot_dir: "/var/www"
caddy_domain_dir: "{{ caddy_webroot_dir }}/{{ caddy_domain }}"

# reality_sfy (required) | xhttp_sfy (not required if caddy_acme_email present)
caddy_fullchain_path: ""
caddy_private_key_path: ""

# xhttp_sfy
caddy_location: "/test-is-test"
caddy_grpc_pass: "grpc://unix:/dev/shm/uds2023.sock"

# install_naive
caddy_forwardproxy_module: "github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@naive" # module@version=repo@branch passed to xcaddy --with
caddy_naive_username: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=16') }}"
caddy_naive_password: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=32') }}"
caddy_naive_upstream_socks: "socks5://127.0.0.1:1080"
