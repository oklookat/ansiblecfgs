---
# required vars: docker_dir; docker_group; docker_network

# networks
caddy_singbox_network: "singbox_network"
caddy_ghost_network: "ghost_network"

# all
caddy_dir: "{{ docker_dir }}/caddy"

## install | install_naive
caddy_compose: "{{ caddy_dir }}/compose.yml"
caddy_reload_script: "{{ caddy_dir }}/reload.sh"

# mount points
caddy_certificates: "" # dir with certificates
caddy_file_server: "{{ caddy_dir }}/fileserver"
caddy_sites_dir: "{{ caddy_dir }}/sites"
caddy_snippets_dir: "{{ caddy_dir }}/snippets"
caddy_domain: "example.com"
caddy_caddyfile: "{{ caddy_dir }}/Caddyfile"
caddy_data: "{{ caddy_dir }}/data" # certificates and account data, see XDG_DATA_HOME in Caddy image
caddy_image: "{{ caddy_dir }}/Dockerfile"
caddy_site_caddyfile: "{{ caddy_sites_dir }}/{{ caddy_domain }}.caddy"

##

# install_naive
caddy_naive_username: "{{ lookup('community.general.random_string', length=24, min_lower=1, min_upper=1, min_numeric=1, min_special=1, override_special='-_=+!#$()[]') }}"
caddy_naive_password: "{{ lookup('community.general.random_string', length=24, min_lower=1, min_upper=1, min_numeric=1, min_special=1, override_special='-_=+!#$()[]') }}"
caddy_disable_insecure_upstreams_check: false
caddy_upstream: ""

# deploy_configs
# caddy_configs: # if not defined, _default will be
caddy_configs_default:
  caddyfile:
    template: main.caddy.j2
  sites:
    - domain: "{{ caddy_domain }}"
      template: site.caddy.j2

# install_naive
caddy_configs_default_naive:
  caddyfile:
    template: main.naive.caddy.j2
  sites:
    - domain: "{{ caddy_domain }}"
      template: naive.caddy.j2

# install_ghost
caddy_ghost_snippets: "{{ caddy_snippets_dir }}/ghost"
caddy_ghost_domain: "example.com"
caddy_ghost_admin_domain: "admin.example.com"
caddy_ghost_reverse_proxy: "ghost:2368"
caddy_ghost_traffic_analytics_reverse_proxy: "traffic-analytics:3000"
caddy_ghost_activitypub_target: "https://ap.ghost.org"
