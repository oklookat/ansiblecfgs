---
- name: Ensure required variables
  ansible.builtin.assert:
    that:
      - docker_dir is defined
      - docker_group is defined
      - wireguard_endpoint | length > 0
      - wireguard_peers | length > 0
    fail_msg: "docker_dir, docker_group, wireguard_endpoint and at least one peer are required"

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    group: "{{ docker_group }}"
    mode: "0755"
  loop:
    - "{{ wireguard_dir }}"
    - "{{ wireguard_config_dir }}"
    - "{{ wireguard_clients_dir }}"
    - "{{ wireguard_dir }}/server"

- name: Copy Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ wireguard_dir }}/Dockerfile"
    mode: "0644"

- name: Copy entrypoint
  ansible.builtin.copy:
    src: entrypoint.sh
    dest: "{{ wireguard_dir }}/entrypoint.sh"
    mode: "0755"

# --- Server keys ---
- name: Check existing server private key
  ansible.builtin.stat:
    path: "{{ wireguard_dir }}/server/privatekey"
  register: _wg_server_priv_stat

- name: Generate server private key
  ansible.builtin.command: wg genkey
  register: _wg_server_priv
  when: not _wg_server_priv_stat.stat.exists and (wireguard_private_key | length == 0)
  changed_when: true

- name: Save server private key
  ansible.builtin.copy:
    content: "{{ wireguard_private_key if wireguard_private_key | length > 0 else _wg_server_priv.stdout }}"
    dest: "{{ wireguard_dir }}/server/privatekey"
    mode: "0600"
  when: not _wg_server_priv_stat.stat.exists or (wireguard_private_key | length > 0)

- name: Read server private key
  ansible.builtin.slurp:
    src: "{{ wireguard_dir }}/server/privatekey"
  register: _wg_server_priv_file

- name: Set server private key fact
  ansible.builtin.set_fact:
    wireguard_private_key: "{{ _wg_server_priv_file.content | b64decode | trim }}"

- name: Generate server public key
  ansible.builtin.shell: "echo '{{ wireguard_private_key }}' | wg pubkey"
  register: _wg_server_pub
  changed_when: false

- name: Set server public key fact
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ _wg_server_pub.stdout | trim }}"

- name: Save server public key
  ansible.builtin.copy:
    content: "{{ wireguard_public_key }}"
    dest: "{{ wireguard_dir }}/server/publickey"
    mode: "0644"

# --- Process peers ---
- name: Process peers
  ansible.builtin.include_tasks: peer.yml
  loop: "{{ wireguard_peers }}"
  loop_control:
    loop_var: peer
    label: "{{ peer.name }}"

- name: Use processed peers
  ansible.builtin.set_fact:
    wireguard_peers: "{{ wireguard_peers_processed }}"
  when: wireguard_peers_processed is defined

# --- Render configs ---
- name: Render server config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_config_dir }}/{{ wireguard_interface }}.conf"
    mode: "0600"

- name: Render compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ wireguard_compose }}"
    mode: "0644"

- name: Ensure network exists
  community.docker.docker_network:
    name: "{{ wireguard_network }}"
    driver: bridge
    enable_ipv6: true
    state: present

- name: Build and start wireguard
  community.docker.docker_compose_v2:
    project_src: "{{ wireguard_dir }}"
    files:
      - "{{ wireguard_compose | basename }}"
    state: present
    build: always
    pull: never
    remove_orphans: true

# --- nftables rules (optional) ---
- name: Deploy nftables rules
  ansible.builtin.template:
    src: wireguard.nft.j2
    dest: "{{ wireguard_nftables_rules_file }}"
    mode: "0644"
  when: wireguard_manage_nftables | bool
