---
- name: Deploy xray config (normal)
  ansible.builtin.template:
    src: "{{ xray_template_config }}"
    dest: "{{ xray_config }}"
    owner: "1000"
    group: "1000"
    mode: "0644"
  when: not xray_openwrt

- name: Deploy xray config (OpenWrt)
  ansible.builtin.include_tasks: deploy_config_openwrt.yml
  when: xray_openwrt
