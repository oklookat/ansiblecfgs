---
- name: Ensure directories for Xray files exist
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ xray_geofiles }}"

- name: Deploy updater script from template
  ansible.builtin.template:
    src: geo_autoupdate.sh.j2
    dest: "{{ xray_geo_autoupdate_script }}"
    mode: '0755'

- name: Deploy systemd service from template
  ansible.builtin.template:
    src: geo_autoupdate.service.j2
    dest: /etc/systemd/system/xray_geo_autoupdate.service
    mode: '0644'

- name: Deploy systemd timer from template
  ansible.builtin.template:
    src: geo_autoupdate.timer.j2
    dest: /etc/systemd/system/xray_geo_autoupdate.timer
    mode: '0644'

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start update timer
  ansible.builtin.systemd:
    name: xray_geo_autoupdate.timer
    enabled: yes
    state: started

- name: Trigger service immediately after enabling timer
  ansible.builtin.systemd:
    name: xray_geo_autoupdate.service
    state: restarted
