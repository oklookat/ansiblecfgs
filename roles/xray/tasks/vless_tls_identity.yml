---
- name: Check if identity exists
  ansible.builtin.stat:
    path: "{{ xray_identity_path }}"
  register: xray_identity_stat

- name: Generate Identity
  when: not xray_identity_stat.stat.exists
  block:
    - name: Ensure identity dir exists
      ansible.builtin.file:
        path: "{{ xray_identity_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Generate UUID
      command: xray uuid
      register: xray_uuid

    - name: Save identity
      ansible.builtin.copy:
        dest: "{{ xray_identity_path }}"
        mode: "0600"
        content: |
          uuid: "{{ xray_uuid.stdout | trim }}"
      register: identity_created

- name: Re-check if identity file exists
  ansible.builtin.stat:
    path: "{{ xray_identity_path }}"
  register: xray_identity_stat

- name: Load identity
  when:
    - xray_identity_stat.stat.exists | default(false)
    - (xray_identity_stat.stat.size | default(0)) > 0
  block:
    - name: Slurp identity file
      ansible.builtin.slurp:
        src: "{{ xray_identity_path }}"
      register: xray_identity_raw

    - name: Parse identity YAML
      ansible.builtin.set_fact:
        xray_identity: "{{ xray_identity_raw['content'] | b64decode | from_yaml }}"
