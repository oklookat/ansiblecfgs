# Paths
xray_dir: "{{ docker_dir }}/xray"
xray_container_name: "xray"
xray_certificates: ""
xray_network: "xray_network"

# install
xray_image: "{{ xray_dir }}/Dockerfile"
xray_data: "{{ xray_dir }}/data"
xray_template_compose: "compose.yml.j2"
xray_compose: "{{ xray_dir }}/compose.yml"
xray_reload_script: "{{ xray_dir }}/reload.sh"

# Config templates
xray_template_config: "mixed.json.j2"
xray_template_config_wg: "mixed.wg.json.j2"

# Listening
xray_listen_port: 1080

# Resource limits
xray_memory: "512m"
xray_memory_reservation: "64m"
xray_cpus: "1.0"

# download_locally
xray_version: "26.3.27"
xray_arch: "arm64-v8a"
xray_local_image: "local/xray-downloader:latest"
xray_local_bin: "./downloaded/xray"

# deploy_config
xray_openwrt: false

# install_openwrt
xray_install_openwrt:
  local_temp: "./temp"
  workdir: "/usr/local/share/xray"
  bin: "/usr/local/bin/xray"
  local_bin: ""
  config: "/etc/xray/config.json"
  local_config: "{{ xray_install_openwrt.local_temp }}/config.json"
  uci: "/etc/config/xray"
  local_uci: "{{ xray_install_openwrt.local_temp }}/uci"
  init: "/etc/init.d/xray"
  local_init: "{{ xray_install_openwrt.local_temp }}/init"

  location_config: "/etc/xray"
  location_asset: "/usr/local/share/xray"
  location_confdir: ""

# geo_autoupdate
xray_share_dir: "/usr/local/share/xray"
xray_geo_autoupdate_script: "/usr/local/bin/xray_geo_autoupdate.sh"
# every monday on 3:00
xray_geo_autoupdate_calendar: "Mon *-*-* 03:00:00"
xray_geofiles:
  - url: "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/refs/heads/release/geoip.dat"
    dest: "{{ xray_share_dir }}/geoip.dat"

  - url: "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/refs/heads/release/geosite.dat"
    dest: "{{ xray_share_dir }}/geosite.dat"

  - url: "https://github.com/runetfreedom/russia-v2ray-rules-dat/raw/refs/heads/release/geoip.dat"
    dest: "{{ xray_share_dir }}/geoip-runetfreedom.dat"

  - url: "https://github.com/runetfreedom/russia-v2ray-rules-dat/raw/refs/heads/release/geosite.dat"
    dest: "{{ xray_share_dir }}/geosite-runetfreedom.dat"
