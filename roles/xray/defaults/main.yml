---
# install | autoupdate
xray_username: "root"

# install
xray_group: "{{ xray_username }}"

xray_bin: "/usr/local/bin/xray"
xray_config_dir: "/usr/local/etc/xray"
xray_log_dir: "/var/log/xray"

xray_systemd_override_dir: "/etc/systemd/system/xray.service.d"
xray_systemd_override_conf: "override.conf"

# autoupdate
xray_autoupdate_without_geodata: true
xray_autoupdate_calendar: monthly
xray_autoupdate_random_delay: 6h
xray_autoupdate_script: "/usr/local/bin/xray_autoupdate.sh"
xray_autoupdate_service: "xray_update.service"
xray_autoupdate_timer: "xray_update.timer"

# deploy_config | vless_tls_xhttp | reality_sfy
xray_config_path: "{{ xray_config_dir }}/config.json"

# vless_tls_xhttp | reality_sfy
xray_identity_path: "{{ xray_config_dir }}/identity.yml"
xray_sni: ""
xray_fingerprint: "chrome"

# vless_tls_xhttp
xray_certificate_path: ""
xray_key_path: ""

# vless_tls_xhttp | xhttp_sfy
xray_xhttp_path: "/hello"

# reality_sfy
xray_dest_port: 443

# xhttp_sfy
xray_listen: "/dev/shm/uds2023.sock,0666"

# geo_autoupdate
xray_share_dir: "/usr/local/share/xray"
xray_geo_autoupdate_script: "/usr/local/bin/xray_geo_autoupdate.sh"
# every monday on 3:00
xray_geo_autoupdate_calendar: "Mon *-*-* 03:00:00"
xray_geofiles:
  - url: "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/refs/heads/release/geoip.dat"
    dest: "{{ xray_share_dir }}/geoip.dat"

  - url: "https://github.com/Loyalsoldier/v2ray-rules-dat/raw/refs/heads/release/geosite.dat"
    dest: "{{ xray_share_dir }}/geosite.dat"

  - url: "https://github.com/runetfreedom/russia-v2ray-rules-dat/raw/refs/heads/release/geoip.dat"
    dest: "{{ xray_share_dir }}/geoip-runetfreedom.dat"

  - url: "https://github.com/runetfreedom/russia-v2ray-rules-dat/raw/refs/heads/release/geosite.dat"
    dest: "{{ xray_share_dir }}/geosite-runetfreedom.dat"