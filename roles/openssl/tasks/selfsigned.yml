---
- name: Install cryptography dependency
  ansible.builtin.package:
    name: python3-cryptography
    state: present

- name: Ensure selfsigned directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ openssl_key_path | dirname }}", mode: "0750" }
    - { path: "{{ openssl_certificate_path | dirname }}", mode: "0755" }

- name: Generate private key if not exists
  community.crypto.openssl_privatekey:
    path: "{{ openssl_key_path }}"
    size: 2048
    type: RSA
    mode: "0600"
    owner: root
    group: root
  register: key_result
  changed_when: key_result.changed

- name: Check if CSR exists
  ansible.builtin.stat:
    path: "{{ openssl_temp_csr_path }}"
  register: csr_stat

- name: Generate CSR
  community.crypto.openssl_csr:
    path: "{{ openssl_temp_csr_path }}"
    privatekey_path: "{{ openssl_key_path }}"
    common_name: "{{ openssl_sni }}"
    subject_alt_name:
      - "DNS:{{ openssl_sni }}"
      - "DNS:www.{{ openssl_sni }}"
  when: key_result.changed or not csr_stat.stat.exists

- name: Generate self-signed certificate
  community.crypto.x509_certificate:
    path: "{{ openssl_certificate_path }}"
    csr_path: "{{ openssl_temp_csr_path }}"
    privatekey_path: "{{ openssl_key_path }}"
    provider: selfsigned
    selfsigned_not_after: "+{{ openssl_cert_days }}d"
    selfsigned_not_before: "+0s"
    mode: "0644"
    owner: root
    group: root
    force: false
  register: cert_result

- name: Cleanup temporary CSR
  ansible.builtin.file:
    path: "{{ openssl_temp_csr_path }}"
    state: absent
  when: cert_result is succeeded
