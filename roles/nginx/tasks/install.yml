---
- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - ca-certificates
      - lsb-release
    state: present
    update_cache: yes

- name: Download NGINX signing key
  ansible.builtin.get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /usr/share/keyrings/nginx_signing.key
    mode: "0644"

- name: Convert NGINX key to GPG dearmor format
  ansible.builtin.command: >
    gpg --dearmor -o /usr/share/keyrings/nginx-archive-keyring.gpg
    /usr/share/keyrings/nginx_signing.key
  args:
    creates: /usr/share/keyrings/nginx-archive-keyring.gpg

- name: Ensure correct permissions on the key
  ansible.builtin.file:
    path: /usr/share/keyrings/nginx-archive-keyring.gpg
    mode: "0644"

- name: Add NGINX mainline repository (DEB822 format)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nginx.sources
    content: |
      Types: deb
      URIs: http://nginx.org/packages/mainline/{{ ansible_distribution | lower }}
      Suites: {{ ansible_distribution_release }}
      Components: nginx
      Signed-By: /usr/share/keyrings/nginx-archive-keyring.gpg
      Architectures: amd64 arm64
    mode: "0644"
  register: repo_added

- name: Update apt cache if repository changed
  ansible.builtin.apt:
    update_cache: yes
  when: repo_added.changed

- name: Install NGINX from mainline repository
  ansible.builtin.apt:
    name: nginx
    state: present
