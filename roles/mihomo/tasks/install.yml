---
- name: Create mihomo configuration directory
  ansible.builtin.file:
    path: "{{ mihomo_config_dir }}"
    state: directory
    mode: "0755"

- name: Check if mihomo binary already exists
  ansible.builtin.stat:
    path: "{{ mihomo_bin_path }}"
  register: mihomo_bin

- name: Download and install mihomo
  block:
    - name: Download mihomo archive
      ansible.builtin.get_url:
        url: "{{ mihomo_download_url }}"
        dest: "/tmp/mihomo.gz"
        mode: "0644"

    - name: Decompress mihomo binary to destination
      ansible.builtin.shell:
        cmd: "gunzip -c /tmp/mihomo.gz > {{ mihomo_bin_path }}"

    - name: Set execution permissions on binary
      ansible.builtin.file:
        path: "{{ mihomo_bin_path }}"
        mode: "0755"
        owner: root
        group: root
  when: not mihomo_bin.stat.exists or mihomo_version not in (mihomo_bin.stat.path | default(''))

- name: Deploy configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ mihomo_config_dir }}/config.yaml"
    mode: "0644"
    force: no
  notify: Restart mihomo

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: mihomo.service.j2
    dest: /etc/systemd/system/mihomo.service
    mode: "0644"
  notify: Restart mihomo

- name: Ensure mihomo is enabled and started
  ansible.builtin.systemd:
    name: mihomo
    state: started
    enabled: yes
    daemon_reload: yes
