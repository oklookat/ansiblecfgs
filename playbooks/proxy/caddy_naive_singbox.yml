---
- name: "include: install Docker"
  ansible.builtin.import_playbook: ../docker/install.yml

- name: "proxy: caddy-naive-sing-box"
  hosts: proxy
  become: true
  tasks:
    - name: "Export vars"
      block:
        - name: "lego: export vars"
          ansible.builtin.include_role:
            name: lego
            tasks_from: export_vars.yml

        - name: "caddy: export vars"
          ansible.builtin.include_role:
            name: caddy
            tasks_from: export_vars.yml

        - name: "sing-box: export vars"
          ansible.builtin.include_role:
            name: singbox
            tasks_from: export_vars.yml

    - name: "Set vars"
      ansible.builtin.set_fact:
        lego_hooks:
          - path: "{{ caddy_reload_script }}"
            name: caddy.sh
          - path: "{{ singbox_reload_script }}"
            name: singbox.sh
        caddy_disable_insecure_upstreams_check: true
        caddy_upstream: "socks5://{{ singbox_container_name }}:{{ singbox_listen_port }}"
        caddy_certificates: "{{ lego_certificates_dir }}"
        caddy_external_networks:
          - "{{ singbox_network }}"

    - name: "lego: install"
      ansible.builtin.include_role:
        name: lego
        tasks_from: install.yml

    - name: "lego: explicit start"
      ansible.builtin.include_role:
        name: lego
        tasks_from: explicit_start.yml

    - name: "sing-box: install"
      block:
        - name: "install"
          ansible.builtin.include_role:
            name: singbox
            tasks_from: install.yml

        - name: "deploy mixed config"
          ansible.builtin.include_role:
            name: singbox
            tasks_from: deploy_config_mixed.yml

    - name: "caddy: install naive"
      ansible.builtin.include_role:
        name: caddy
        tasks_from: install_naive.yml

    - name: "lego: copy hooks"
      ansible.builtin.include_role:
        name: lego
        tasks_from: copy_hooks.yml

    - name: "caddy: rebuild"
      ansible.builtin.include_role:
        name: caddy
        tasks_from: rebuild.yml

    - name: "singbox: rebuild"
      ansible.builtin.include_role:
        name: singbox
        tasks_from: rebuild.yml
