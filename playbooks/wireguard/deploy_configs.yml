---
- name: "wireguard: deploy configs"
  hosts: all
  become: true
  tasks:
    - name: Ensure wireguard-tools is present
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true

    - name: "wireguard: deploy configs"
      ansible.builtin.include_role:
        name: wireguard
        tasks_from: deploy_configs.yml
