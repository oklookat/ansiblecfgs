---
- name: "xray: install openwrt"
  hosts: openwrt
  gather_facts: false
  vars:
    based: "{{ playbook_dir }}/temp"
    xray_version: "26.3.27"
    xray_arch: "arm64-v8a"
    xray_local_bin: "{{ based }}/xray"
    upx_input: "{{ xray_local_bin }}"
    upx_output: "{{ based }}/xray.upx"

    xray_install_openwrt_override:
      local_temp: "{{ based }}"
      local_bin: "{{ upx_output }}"

  tasks:
    - block:
        - name: "xray: download locally"
          ansible.builtin.include_role:
            name: xray
            tasks_from: download_locally.yml

        - name: "upx: compress xray"
          ansible.builtin.include_role:
            name: upx
            tasks_from: main.yml

        - name: "xray: export vars"
          ansible.builtin.include_role:
            name: xray
            tasks_from: export_vars.yml

        - name: Merge xray settings
          ansible.builtin.set_fact:
            xray_install_openwrt: >-
              {{
                xray_install_openwrt
                | combine(xray_install_openwrt_override)
              }}

        - name: "xray: install openwrt"
          ansible.builtin.include_role:
            name: xray
            tasks_from: install_openwrt.yml

      always:
        - name: Remove temporary xray files
          delegate_to: localhost
          become: false
          ansible.builtin.file:
            path: "{{ based }}"
            state: absent
