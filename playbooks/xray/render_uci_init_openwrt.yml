---
- name: "xray: rerender uci.j2, init.j2"
  hosts: openwrt
  gather_facts: false
  vars:
    based: "{{ playbook_dir }}/temp"
    xray_version: "26.3.27"
    xray_arch: "arm64-v8a"
    xray_local_bin: "{{ based }}/xray"
    upx_input: "{{ xray_local_bin }}"
    upx_output: "{{ based }}/xray.upx"

    xray_install_openwrt_override:
      local_temp: "{{ based }}"
      local_bin: "{{ upx_output }}"

  tasks:
    - name: "xray: export vars"
      ansible.builtin.include_role:
        name: xray
        tasks_from: export_vars.yml

    - name: Merge xray settings
      ansible.builtin.set_fact:
        xray_install_openwrt: >-
          {{
            xray_install_openwrt
            | combine(xray_install_openwrt_override)
          }}

    - name: "xray: render uci init"
      ansible.builtin.include_role:
        name: xray
        tasks_from: render_uci_init_openwrt.yml

    - name: Start xray service
      ansible.builtin.raw: service xray start || true
